name: Deploy Production

# Deploys only run after CI passes on master, so a red build can never ship.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false # let an in-progress deployment finish before starting a new one

# The job only talks to the server over SSH, so it needs no GitHub token access.
permissions: {}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        # Replace with the full commit SHA of the release you pick (see notes below)
        uses: appleboy/ssh-action@<0ff4204d59e8e51228ff73bce53f80d53301dee2> # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script_stop: true
          script: |
            set -eu
            cd ~/app-prod

            PROJECT="${{ vars.COMPOSE_PROJECT_NAME }}"
            REPO="${{ github.repository }}"
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            BACKUP_DIR="$HOME/backups"
            BACKUP_FILE="$BACKUP_DIR/pre-deploy-$(date +%Y%m%d%H%M%S).sql"

            chmod 600 .env
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"

            DOMAIN=$(grep -E '^DOMAIN=' .env | cut -d= -f2-)
            if [ -z "$DOMAIN" ]; then
              echo "DOMAIN is missing from .env"
              exit 1
            fi
            if echo "$DOMAIN" | grep -q '://'; then
              echo "DOMAIN must be a bare hostname (no http:// or https://). Put the full URL in ORIGIN."
              exit 1
            fi

            if [ -d ".git" ]; then
              git remote set-url origin git@github.com:$REPO.git
            else
              git init
              git remote add origin git@github.com:$REPO.git
            fi

            PREVIOUS_SHA=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "Deploying $DEPLOY_SHA (previous: $PREVIOUS_SHA)"

            rollback() {
              echo "Deploy failed - container state:"
              docker compose -p "$PROJECT" ps -a || true
              docker compose -p "$PROJECT" logs --tail=30 frontend backend || true
              echo "Rolling back to $PREVIOUS_SHA"
              if [ "$PREVIOUS_SHA" != "none" ]; then
                git reset --hard "$PREVIOUS_SHA"
                docker compose -p "$PROJECT" --env-file .env up -d --build --remove-orphans
              fi
              echo "Pre-deploy dump: $BACKUP_FILE"
              exit 1
            }

            RUNNING_SERVICES=$(docker compose -p "$PROJECT" ps --services --filter "status=running" || true)

            if echo "$RUNNING_SERVICES" | grep -q "^db$"; then
              install -m 600 /dev/null "$BACKUP_FILE.tmp"
              docker compose -p "$PROJECT" exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$BACKUP_FILE.tmp"
              mv "$BACKUP_FILE.tmp" "$BACKUP_FILE"
            else
              echo "Database container not running yet - skipping pre-deploy dump."
            fi

            ls -t "$BACKUP_DIR"/*.sql 2>/dev/null | tail -n +6 | xargs -r rm -- || true

            git fetch origin master
            git reset --hard "$DEPLOY_SHA"

            if ! docker compose -p "$PROJECT" --env-file .env up -d --build --remove-orphans; then
              rollback
            fi

            HEALTHY=0
            for i in $(seq 1 20); do
              if curl -fsS --max-time 5 --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/api/health" > /dev/null; then
                HEALTHY=1
                break
              fi
              sleep 6
            done

            if [ "$HEALTHY" -ne 1 ]; then
              rollback
            fi

            docker image prune -f
