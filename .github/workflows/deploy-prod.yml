name: Deploy Production

# Deploys only run after CI passes on master, so a red build can never ship.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false # let an in-progress deployment finish before stating a new one

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd ~/app-prod
            PROJECT="${{ vars.COMPOSE_PROJECT_NAME }}"

            if [ -d ".git" ]; then
              git remote set-url origin git@github.com:${{ github.repository }}.git
            else
              git init
              git remote add origin git@github.com:${{ github.repository }}.git
            fi

            # Snapshot current commit so we can roll back if the new build fails the health check
            PREVIOUS_SHA=$(git rev-parse HEAD 2>/dev/null || echo "none")

            # Back up the db before making changes.
            mkdir -p ~/backups

            # Load DB credentials from .env
            set +x
            set -a; [ -f .env ] && . ./.env; set +a
            set -x

            # Safely check if 'db' is running without triggering ssh-action exit traps
            RUNNING_SERVICES=$(docker compose -p "$PROJECT" ps --services --filter "status=running" || true)

            if echo "$RUNNING_SERVICES" | grep -q "^db$"; then DB_RUNNING=yes; else DB_RUNNING=no; fi
            if [ "$DB_RUNNING" = "yes" ]; then
              # Fail fast if the dump fails: never reset code on top of an
              # unprotected database. Dumps are local-only (see backups note
              # below); offsite copy is a manual step for now.
              docker compose -p "$PROJECT" exec -T db pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" > ~/backups/pre-deploy-$(date +%Y%m%d%H%M%S).sql
            else
              echo "Database container not running yet — skipping pre-deploy dump."
            fi

            # Keep last 5 backups
            ls -t ~/backups/*.sql 2>/dev/null | tail -n +6 | xargs -r rm -- || true

            # Pull latest changes
            git fetch origin master
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            
            UP_OK=0
            docker compose -p "$PROJECT" --env-file .env up -d --build --remove-orphans && UP_OK=1 || true

            HEALTHY=0
            if [ "$UP_OK" -eq 1 ]; then
              for i in $(seq 1 20); do
                if curl -fs http://localhost/api/health > /dev/null; then
                  HEALTHY=1
                  break
                fi
                sleep 6
              done
            fi

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Health check failed - rolling back to $PREVIOUS_SHA"
              # Rollback is code-only: migrations are forward-only, so a failed
              # deploy that already migrated needs the pre-deploy dump above
              # restored manually with psql.
              if [ "$PREVIOUS_SHA" != "none" ]; then
                git reset --hard "$PREVIOUS_SHA"
                docker compose -p "$PROJECT" --env-file .env up -d --build --remove-orphans
              fi
              exit 1
            fi

            # Prune unused images
            docker image prune -f
