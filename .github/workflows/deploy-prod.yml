name: Deploy Production

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false # let an in-progress deployment finish before stating a new one

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/app-prod
            PROJECT="${{ vars.COMPOSE_PROJECT_NAME }}"

            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
            fi

            # Snapshot current commit so we can roll back if the new build fails the health check
            PREVIOUS_SHA=$(git rev-parse HEAD 2>/dev/null || echo "none")

            # Back up the db before making changes. Migrations run automatically on boot so this is the final chance
            mkdir -p ~/backups
            # Load DB credentials from .env so pg_dump gets the correct user/db (compose.yml:6-8)
            set -a; [ -f .env ] && . ./.env; set +a
            docker compose -p "$PROJECT" exec -T db \
            	pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" > ~/backups/pre-deploy-$(date +%Y%m%d%H%M%S).sql || true
            ls -t ~/backups/*.sql 2>/dev/null | tail -n +6 | xargs -r rm -- # keep last 5 backups



            # Pull latest changes
            git fetch origin master
            git reset --hard origin/master

            # Rebuild and start containers
            docker compose -p "$PROJECT" --env-file .env up -d --build --remove-orphans

            HEALTHY=0
            for i in $(seq 1 10); do
            	if curl -fs http://localhost/ > /dev/null; then
             		HEALTHY=1
               		break
                fi
                sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
            	echo "Health check failed - rolling back to $PREVIOUS_SHA"
             	if [ "$PREVIOUS_SHA" != "none" ]; then
              		git reset --hard "$PREVIOUS_SHA"
                	docker compose -p "$PROJECT" --env-file .env up -d --build --remove-orphans
                fi
                exit 1
            fi

            # Prune unused images
            docker image prune -f
